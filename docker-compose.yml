# docker-compose.yml
# Standalone Data Observability stack (Marquez / OpenLineage backend).
# Deployed separately from the streaming pipeline (Kafka/Connect) —
# reachable over the network for whatever emits OpenLineage events to it.

services:
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data

  marquez-api:
    image: ghcr.io/rahimcc/marquez-arm:latest
    depends_on:
      - marquez-db
    environment:
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5555:5000"   # HTTP API — where OpenLineage events get sent
      - "5556:5001"   # admin/healthcheck interface

  marquez-web:
    image: ghcr.io/rahimcc/marquez-web-arm:latest
    depends_on:
      - marquez-api
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "3333:3000"   # the UI

  oauth2-proxy:
      image: quay.io/oauth2-proxy/oauth2-proxy:latest
      container_name: oauth2-proxy-${SERVICE_NAME}
      command: --http-address=0.0.0.0:4180
      environment:
        OAUTH2_PROXY_PROVIDER: keycloak-oidc
        OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
        OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
        OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
        OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
        OAUTH2_PROXY_COOKIE_NAME: _oauth2_${SERVICE_NAME}
        OAUTH2_PROXY_EMAIL_DOMAINS: "*"
        OAUTH2_PROXY_UPSTREAMS: ${UPSTREAM_URL}
        OAUTH2_PROXY_REDIRECT_URL: ${REDIRECT_URL}
      ports: 
         - "${PROXY_PORT}:4180"
      extra_hosts:
         - "keycloak.turyan.site:10.0.0.12"

volumes:
  marquez-db-data: