name: Build multi-arch Marquez image

on:
  workflow_dispatch:      # manual trigger
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "api/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lets the amd64 GitHub runner emulate arm64 for the build —
      # you don't need a real arm64 machine to produce an arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/marquez-arm:latest
            ghcr.io/${{ github.repository_owner }}/marquez-arm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max