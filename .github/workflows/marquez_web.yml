name: Build multi-arch Marquez Web image

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Pulls the actual Marquez source, since it doesn't live in this repo
      - name: Checkout Marquez upstream source
        uses: actions/checkout@v4
        with:
          repository: MarquezProject/marquez
          ref: main            # or pin to a specific tag, e.g. "0.50.0", for a reproducible build
          path: marquez-source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./marquez-source/web   # points into the freshly-checked-out upstream repo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/marquez-web-arm:latest
            ghcr.io/${{ github.repository_owner }}/marquez-web-arm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max